{{- $root := . -}}
{{- $components := dict "api" (dict "image" "api" "port" 8000) "worker" (dict "image" "worker" "port" 8002) "inference" (dict "image" "inference" "port" 8004) "frontend" (dict "image" "frontend" "port" 8080) -}}
{{- if .Values.demo.enabled -}}
{{- $_ := set $components "observer" (dict "image" "api" "port" 8003) -}}
{{- $_ := set $components "demo" (dict "image" "demo" "port" 8000) -}}
{{- end -}}
{{- range $name, $component := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels: {{- include "sentinel.labels" $root | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ if eq $name "demo" }}demo-service{{ else }}{{ $root.Release.Name }}-{{ $name }}{{ end }}
  labels: {{- include "sentinel.labels" $root | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ $root.Release.Name }}, component: {{ $name }}}
  ports:
    - {name: http, port: {{ $component.port }}, targetPort: http}
    {{- if eq $name "demo" }}
    - {name: agent, port: 9101, targetPort: agent}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels: {{- include "sentinel.labels" $root | nindent 4 }}
spec:
  replicas: 1
  {{- if or (eq $name "inference") (eq $name "demo") }}
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, component: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, component: {{ $name }}}
      annotations:
        checksum/settings: {{ include (print $root.Template.BasePath "/config.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ $root.Release.Name }}-{{ $name }}
      automountServiceAccountToken: false
      {{- if $root.Values.imagePullSecrets }}
      imagePullSecrets: {{ $root.Values.imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: {{ ternary 101 10001 (eq $name "frontend") }}, runAsGroup: {{ ternary 101 10001 (eq $name "frontend") }}, fsGroup: {{ ternary 101 10001 (eq $name "frontend") }}, seccompProfile: {type: RuntimeDefault}}
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      terminationGracePeriodSeconds: 30
      {{- if ne $name "demo" }}
      initContainers:
        - name: {{ if eq $name "api" }}migrate{{ else }}wait-for-api{{ end }}
          image: {{ include "sentinel.image" (list $root "api") | quote }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          {{- if eq $name "api" }}
          command: [alembic, upgrade, head]
          {{- else }}
          command: [python, -c]
          args:
            - |
              import time, urllib.request
              for attempt in range(60):
                  try:
                      urllib.request.urlopen('http://{{ $root.Release.Name }}-api:8000/ready', timeout=5)
                      break
                  except Exception:
                      time.sleep(5)
              else:
                  raise SystemExit('API readiness deadline exceeded')
          {{- end }}
          {{- if eq $name "api" }}
          envFrom: [{configMapRef: {name: {{ $root.Release.Name }}-settings}}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: postgres-password}}
            - name: API_READ_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: api-read-token}}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ $root.Values.resources.api | toYaml | nindent 12 }}
        {{- if eq $name "inference" }}
        - name: register-frozen-model
          image: {{ include "sentinel.image" (list $root "inference") | quote }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          command: [python, -m, inference.register]
          envFrom: [{configMapRef: {name: {{ $root.Release.Name }}-settings}}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: postgres-password}}
            - name: API_READ_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: api-read-token}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ $root.Values.resources.inference | toYaml | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "sentinel.image" (list $root $component.image) | quote }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          {{- if eq $name "api" }}
          command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
          {{- else if eq $name "observer" }}
          command: [python, -m, app.workers.observer]
          {{- end }}
          ports: [{name: http, containerPort: {{ $component.port }}}]
          {{- if ne $name "frontend" }}
          envFrom: [{configMapRef: {name: {{ $root.Release.Name }}-settings}}]
          env:
            {{- if ne $name "demo" }}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: postgres-password}}
            - name: API_READ_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: api-read-token}}
            {{- end }}
            {{- if or (eq $name "api") (eq $name "observer") (eq $name "demo") }}
            - name: CHAOS_CONTROL_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret }}, key: chaos-token}}
            {{- end }}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ index $root.Values.resources $name | toYaml | nindent 12 }}
          readinessProbe:
            httpGet: {path: {{ if eq $name "api" }}/ready{{ else if eq $name "demo" }}/health{{ else if eq $name "frontend" }}/healthz{{ else }}/metrics{{ end }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 8
          livenessProbe:
            httpGet: {path: {{ if or (eq $name "api") (eq $name "demo") }}/health{{ else if eq $name "frontend" }}/healthz{{ else }}/metrics{{ end }}, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            httpGet: {path: {{ if or (eq $name "api") (eq $name "demo") }}/health{{ else if eq $name "frontend" }}/healthz{{ else }}/metrics{{ end }}, port: http}
            failureThreshold: 30
            periodSeconds: 10
          {{- if eq $name "frontend" }}
          volumeMounts:
            - {name: frontend-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          {{- else if eq $name "inference" }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          {{- end }}
        {{- if eq $name "demo" }}
        - name: demo-agent
          image: {{ include "sentinel.image" (list $root "agent") | quote }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          env:
            - {name: HOST_ID, value: sentinel-demo}
            - {name: HOST_NAME, value: Kubernetes demo pod}
            - {name: ENVIRONMENT, value: {{ $root.Values.environment }}}
            - {name: AGENT_BIND_ADDRESS, value: "0.0.0.0"}
          ports: [{name: agent, containerPort: 9101}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ $root.Values.resources.agent | toYaml | nindent 12 }}
          readinessProbe: {httpGet: {path: /metrics, port: agent}}
          livenessProbe: {httpGet: {path: /metrics, port: agent}}
        {{- end }}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        {{- if eq $name "frontend" }}
        - {name: frontend-config, configMap: {name: {{ $root.Release.Name }}-frontend}}
        {{- end }}
{{- end }}
