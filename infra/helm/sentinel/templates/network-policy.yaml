{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-internal
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}}}
      ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 3000}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- if not .Values.database.internal }}
    - to: [{ipBlock: {cidr: {{ .Values.database.externalCIDR }}}}]
      ports: [{protocol: TCP, port: {{ .Values.database.port }}}]
    {{- end }}
---
# Discovery/API and hostNetwork node targets require routes outside pod selectors.
# CNI/node behavior must be verified in the selected cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-prometheus-discovery
spec:
  podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: prometheus}}
  policyTypes: [Egress]
  egress:
    - ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}, {protocol: TCP, port: 9101}]
{{- end }}
