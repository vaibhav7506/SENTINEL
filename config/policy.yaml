policy:
  retry:
    max_attempts: 3
    base_delay_seconds: 2.0
    max_delay_seconds: 60.0
    exponential_base: 2.0

  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_seconds: 300.0
    half_open_max_calls: 3

  storm_guard:
    max_concurrent_remediations: 2
    cooldown_seconds: 60.0

  alerting:
    webhook_url: ""
    webhook_type: "slack"
    notify_on_incident: true
    notify_on_prediction: true
    prediction_threshold: 0.7

  polling:
    interval_seconds: 300
    timeout_seconds: 5.0
    concurrent_limit: 10