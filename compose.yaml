name: sentinel
services:
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
      TIMESCALEDB_TELEMETRY: "off"
      NO_TS_TUNE: "true"
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["timescaledb-data:/var/lib/postgresql/data"]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-sentinel}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run python scripts/init_env.py first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports: ["127.0.0.1:${GRAFANA_PORT:-4300}:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  sentinel-api:
    build: {context: ./backend, target: runtime}
    environment: &backend-environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
      PROMETHEUS_URL: http://prometheus:9090
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-3}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
      RUNBOOKOS_ENABLED: ${RUNBOOKOS_ENABLED:-false}
      RUNBOOKOS_BASE_URL: ${RUNBOOKOS_BASE_URL:-}
      RUNBOOKOS_API_KEY: ${RUNBOOKOS_API_KEY:-}
      RUNBOOKOS_ADAPTER: ${RUNBOOKOS_ADAPTER:-mock}
      RUNBOOKOS_PROPOSAL_THRESHOLD: ${RUNBOOKOS_PROPOSAL_THRESHOLD:-0.995}
      FEATURE_INTERVAL_SECONDS: ${FEATURE_INTERVAL_SECONDS:-60}
      FEATURE_WINDOW_SECONDS: ${FEATURE_WINDOW_SECONDS:-900}
      FEATURE_FRESHNESS_SECONDS: ${FEATURE_FRESHNESS_SECONDS:-90}
      FEATURE_QUERY_TIMEOUT_SECONDS: ${FEATURE_QUERY_TIMEOUT_SECONDS:-15}
      CHAOS_ENABLED: ${CHAOS_ENABLED:-false}
      CHAOS_ALLOWED_ENVIRONMENTS: '${CHAOS_ALLOWED_ENVIRONMENTS:-[]}'
      CHAOS_ALLOWED_NAMESPACES: '${CHAOS_ALLOWED_NAMESPACES:-[]}'
      CHAOS_ALLOWED_TARGETS: '${CHAOS_ALLOWED_TARGETS:-[]}'
      CHAOS_CONTROL_TOKEN: ${CHAOS_CONTROL_TOKEN:-}
      OBSERVATION_INTERVAL_SECONDS: ${OBSERVATION_INTERVAL_SECONDS:-2}
      OBSERVATION_LATENCY_SLO_SECONDS: ${OBSERVATION_LATENCY_SLO_SECONDS:-0.5}
      PREDICTION_HORIZON_SECONDS: ${PREDICTION_HORIZON_SECONDS:-600}
      DATASET_RECOVERY_EXCLUSION_SECONDS: ${DATASET_RECOVERY_EXCLUSION_SECONDS:-900}
      FEATURE_HOST_SERVICE_MAP: '${FEATURE_HOST_SERVICE_MAP:-{"docker-vm":"demo-service"}}'
    command: ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      timescaledb: {condition: service_healthy}
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  sentinel-worker:
    build: {context: ./backend, target: worker}
    environment: *backend-environment
    command: ["python", "-m", "app.workers.features"]
    depends_on:
      sentinel-api: {condition: service_healthy}
    restart: unless-stopped
  sentinel-observer:
    build: ./backend
    environment: *backend-environment
    command: ["python", "-m", "app.workers.observer"]
    depends_on:
      sentinel-api: {condition: service_healthy}
      demo-service: {condition: service_healthy}
    restart: unless-stopped
  sentinel-frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:8080"]
    depends_on:
      sentinel-api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  sentinel-agent:
    build: ./agent
    environment:
      HOST_ID: docker-vm
      HOST_NAME: Docker Linux VM
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AGENT_BIND_ADDRESS: 0.0.0.0
      AGENT_PORT: 9101
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
  demo-service:
    build: ./demo-service
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CHAOS_ENABLED: ${CHAOS_ENABLED:-false}
      CHAOS_ALLOWED_ENVIRONMENTS: '${CHAOS_ALLOWED_ENVIRONMENTS:-[]}'
      CHAOS_ALLOWED_NAMESPACES: '${CHAOS_ALLOWED_NAMESPACES:-[]}'
      CHAOS_ALLOWED_TARGETS: '${CHAOS_ALLOWED_TARGETS:-[]}'
      CHAOS_CONTROL_TOKEN: ${CHAOS_CONTROL_TOKEN:-}
    ports: ["127.0.0.1:${DEMO_PORT:-8001}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
volumes:
  timescaledb-data:
  prometheus-data:
  grafana-data:
