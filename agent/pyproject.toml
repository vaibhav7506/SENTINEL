[project]
name = "sentinel-agent"
version = "0.2.0"
requires-python = ">=3.14,<3.15"
dependencies = ["psutil==7.2.2", "prometheus-client==0.26.0", "pydantic-settings==2.15.0"]

[project.scripts]
sentinel-agent = "sentinel_agent.main:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-psutil==7.2.2.20260906",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["sentinel_agent"]
