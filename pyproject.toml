[project]
name = "sentinel-legacy"
version = "0.1.0"
description = "Preserved original Sentinel service poller (outside the Compose platform)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiohttp==3.14.3",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-mock==3.15.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
