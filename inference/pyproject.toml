[project]
name = "sentinel-inference"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "sentinel-backend", "torch==2.14.0", "scikit-learn==1.9.1",
  "numpy==2.5.3", "joblib==1.6.0", "shap==0.52.0",
]

[tool.uv.sources]
sentinel-backend = { path = "../backend", editable = true }
torch = { url = "https://download.pytorch.org/whl/cpu/torch-2.14.0%2Bcpu-cp314-cp314-win_amd64.whl" }

[tool.uv]
environments = ["sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9", "mypy==2.3.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/inference-tmp"

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "shap.*"]
ignore_missing_imports = true
