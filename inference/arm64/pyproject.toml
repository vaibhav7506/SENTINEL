[project]
name = "sentinel-inference-arm64"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "sentinel-backend", "torch==2.14.0", "scikit-learn==1.9.1",
  "numpy==2.5.3", "joblib==1.6.0", "shap==0.52.0",
]

[tool.uv.sources]
sentinel-backend = { path = "../../backend", editable = true }
torch = { url = "https://download-r2.pytorch.org/whl/cpu/torch-2.14.0%2Bcpu-cp314-cp314-manylinux_2_28_aarch64.whl" }

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9", "mypy==2.3.1"]
