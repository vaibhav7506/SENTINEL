[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Sentinel foundation API and worker"
requires-python = ">=3.14,<3.15"
dependencies = ["prometheus-client==0.26.0", 
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.1",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9", "mypy==2.3.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app"]
