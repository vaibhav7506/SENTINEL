name: Sentinel CI and images
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: sentinel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {version: "0.12.19"}
      - run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --project backend --frozen --python 3.14.7
          uv sync --project agent --frozen --python 3.14.7
          uv sync --project demo-service --frozen --python 3.14.7
          uv sync --project training --frozen --python 3.14.7
          uv sync --project inference --frozen --python 3.14.7
          uv sync --frozen
          uv pip install --python backend/.venv/Scripts/python.exe --require-hashes -r backend/saas-runtime/requirements.txt
          uv pip install --python inference/.venv/Scripts/python.exe --require-hashes -r backend/saas-runtime/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Lint and formatting
        run: |
          inference/.venv/Scripts/ruff.exe check --config backend/pyproject.toml backend agent demo-service inference training scripts queue
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          inference/.venv/Scripts/ruff.exe format --check --config backend/pyproject.toml backend agent demo-service inference training scripts queue
          exit $LASTEXITCODE
      - name: Strict production typing
        run: |
          inference/.venv/Scripts/mypy.exe --config-file inference/pyproject.toml backend/app inference/alerts.py inference/scoring.py inference/summaries.py inference/worker.py inference/push_runner.py inference/email_delivery.py inference/register.py inference/verify.py training/artifacts.py training/runtime.py training/train.py training/labels.py training/build_dataset.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          agent/.venv/Scripts/mypy.exe --config-file agent/pyproject.toml agent/sentinel_agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          backend/.venv/Scripts/mypy.exe --config-file backend/pyproject.toml demo-service/app
          exit $LASTEXITCODE
      - name: Python contracts and frozen model
        run: |
          backend/.venv/Scripts/python.exe scripts/build_agent_bundle.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          backend/.venv/Scripts/python.exe -m pytest -c backend/pyproject.toml backend/tests --ignore=backend/tests/test_feature_database.py --ignore=backend/tests/test_observer_database.py --ignore=backend/tests/test_proposal_database.py --ignore=backend/tests/test_console_database.py --ignore=backend/tests/test_saas_database.py --ignore=backend/tests/test_push_database.py --ignore=backend/tests/test_push_failure_database.py -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .pytest_cache | Out-Null
          inference/.venv/Scripts/python.exe -m pytest -c inference/pyproject.toml inference/tests --ignore=inference/tests/test_database.py --ignore=inference/tests/test_registration_database.py training/tests -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          agent/.venv/Scripts/python.exe -m pytest -c agent/pyproject.toml agent/tests -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --frozen --directory demo-service python -m pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pytest tests -q
          exit $LASTEXITCODE
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "22.22.0", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install verified Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          echo '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  /tmp/helm.tar.gz' | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - run: |
          python -m pip install -r infra/validation/requirements.txt
          python scripts/verify_release_chart.py --render-dir .runtime/chart-renders
      - name: Kubernetes 1.37 schema validation
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz' | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary -kubernetes-version 1.37.0 .runtime/chart-renders/*.yaml
  linux-inference-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      database:
        image: timescale/timescaledb:2.30.1-pg17
        env: {POSTGRES_USER: sentinel, POSTGRES_PASSWORD: isolated-ci-only-password, POSTGRES_DB: sentinel, TIMESCALEDB_TELEMETRY: "off", NO_TS_TUNE: "true"}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2.9-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target test -f inference/Dockerfile -t sentinel-inference:test .
      - run: docker run --rm sentinel-inference:test
      - name: Five database cohorts, tenant isolation and rollback guard
        run: >-
          docker run --rm --network host -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_PORT=5432
          -e POSTGRES_DB=sentinel -e POSTGRES_USER=sentinel -e POSTGRES_PASSWORD=isolated-ci-only-password
          sentinel-inference:test python scripts/check_phase10_database.py
  push-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with: {version: "0.12.19"}
      - run: |
          uv sync --project inference/linux --frozen --python 3.14.7
          uv pip install --python inference/linux/.venv/bin/python --require-hashes -r backend/saas-runtime/requirements.txt
          uv run --project inference/linux --no-sync python scripts/init_env.py
          docker compose -p sentinel -f compose.yaml -f compose.push.yaml up -d --wait timescaledb redis
          docker build -f queue/Dockerfile -t sentinel-push:phase3 .
          uv run --project inference/linux --no-sync python scripts/check_push_database.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: synthetic-push-load, path: .runtime/phase3/load.json}
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: api, context: backend, file: backend/Dockerfile, target: runtime}
          - {component: worker, context: backend, file: backend/Dockerfile, target: worker}
          - {component: agent, context: agent, file: agent/Dockerfile, target: runtime}
          - {component: demo, context: demo-service, file: demo-service/Dockerfile, target: runtime}
          - {component: frontend, context: frontend, file: frontend/Dockerfile, target: ""}
          - {component: inference, context: ., file: inference/Dockerfile, target: runtime}
          - {component: push, context: ., file: queue/Dockerfile, target: runtime}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          platforms: linux/amd64
          tags: sentinel-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan runtime image; critical findings block publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentinel-${{ matrix.component }}:ci
          version: v0.74.0
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
  arm64-inference:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --platform linux/arm64 --target test -f infra/oracle/inference.Dockerfile -t sentinel-inference-arm64:test .
      - run: docker run --rm --platform linux/arm64 sentinel-inference-arm64:test
  arm64-containers:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: api, context: backend, file: backend/Dockerfile, target: runtime}
          - {component: frontend, context: frontend, file: frontend/Dockerfile, target: ""}
          - {component: push, context: ., file: queue/Dockerfile.arm64, target: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          platforms: linux/arm64
          tags: sentinel-${{ matrix.component }}-arm64:ci
          cache-from: type=gha,scope=${{ matrix.component }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-arm64
      - name: Scan ARM64 runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentinel-${{ matrix.component }}-arm64:ci
          version: v0.74.0
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
  publish:
    needs: [python, frontend, chart, linux-inference-and-database, push-pipeline, containers, arm64-inference, arm64-containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        include:
          - {component: api, context: backend, file: backend/Dockerfile, target: runtime}
          - {component: worker, context: backend, file: backend/Dockerfile, target: worker}
          - {component: agent, context: agent, file: agent/Dockerfile, target: runtime}
          - {component: demo, context: demo-service, file: demo-service/Dockerfile, target: runtime}
          - {component: frontend, context: frontend, file: frontend/Dockerfile, target: ""}
          - {component: inference, context: ., file: inference/Dockerfile, target: runtime}
          - {component: push, context: ., file: queue/Dockerfile, target: runtime}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: registry
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.prefix }}/sentinel-${{ matrix.component }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
      - name: Save immutable image reference
        env:
          IMAGE: ${{ steps.registry.outputs.prefix }}/sentinel-${{ matrix.component }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-${{ matrix.component }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.component }}
          path: image-${{ matrix.component }}.txt
  publish-arm64:
    needs: [python, frontend, chart, linux-inference-and-database, push-pipeline, containers, arm64-inference, arm64-containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        include:
          - {component: api, context: backend, file: backend/Dockerfile, target: runtime}
          - {component: frontend, context: frontend, file: frontend/Dockerfile, target: ""}
          - {component: push, context: ., file: queue/Dockerfile.arm64, target: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: registry
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/arm64
          tags: ${{ steps.registry.outputs.prefix }}/sentinel-${{ matrix.component }}-arm64:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}-arm64
      - name: Save immutable ARM64 image reference
        env:
          IMAGE: ${{ steps.registry.outputs.prefix }}/sentinel-${{ matrix.component }}-arm64
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-${{ matrix.component }}-arm64.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.component }}-arm64
          path: image-${{ matrix.component }}-arm64.txt
