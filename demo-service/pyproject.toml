[project]
name = "sentinel-demo-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["prometheus-client==0.26.0", "fastapi>=0.141.1,<0.142", "uvicorn>=0.54,<0.55"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
